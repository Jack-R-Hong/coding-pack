name: coding-quick-dev
version: 2
description: "Quick development: spec → implement → test → QA review → fix → re-test"
requires:
  - plugin: provider-claude-code
  - plugin: bmad-method
  - plugin: plugin-test-runner
steps:
  # Step 1: Quick Flow Solo Dev creates lean spec
  - id: quick_spec
    type: agent
    depends_on: []
    executor: bmad-method
    config:
      model_tier: fast
      system_prompt: |
        You are bmad/quick-flow-solo-dev. Create a minimal but complete tech spec:
        - What to build (scope boundary)
        - Key implementation decisions
        - Files to create/modify
        - Test approach (1-2 sentences)
        Keep it lean. No bureaucracy.
      max_tokens: 2048
      timeout_seconds: 180

  # Step 2: Implement
  - id: implement
    type: agent
    depends_on: [quick_spec]
    executor: provider-claude-code
    config:
      model_tier: balanced
      system_prompt: |
        You are a fast-moving developer. Implement cleanly and efficiently per the spec.
        Ship working code with basic test coverage.
      max_tokens: 4096
      context_from: [quick_spec]
      timeout_seconds: 600

  # Step 3: Run tests
  - id: run_tests
    type: function
    depends_on: [implement]
    executor: plugin-test-runner
    config:
      command: ["plugin-test-runner", "validate"]
      action: validate
      timeout_seconds: 120

  # Step 4: QA review
  - id: qa_review
    type: agent
    depends_on: [run_tests]
    executor: bmad-method
    config:
      model_tier: balanced
      system_prompt: |
        You are bmad/qa. Review this implementation for quality issues:
        - Edge cases not covered by tests
        - Error handling gaps
        - Security concerns (injection, path traversal, etc.)
        - Code clarity and maintainability

        Classify each issue by severity:
        - [CRITICAL] Security vulnerability, data loss risk, crash — blocks merge, needs architecture review
        - [HIGH] Broken functionality, missing error handling — should fix before merge
        - [LOW] Style, naming, minor improvement — can fix later

        End your review with exactly one verdict:
        verdict: approve — no issues or only LOW issues
        verdict: request-changes — has HIGH issues that can be fixed now
        verdict: reject — has CRITICAL issues, do NOT attempt auto-fix, escalate to human

        List issues as:
        - [CRITICAL] description
        - [HIGH] description
        - [LOW] description
      max_tokens: 4096
      context_from: [implement]
      timeout_seconds: 300

  # Step 5: Apply QA fixes (uses QA feedback as instructions)
  - id: apply_fixes
    type: agent
    depends_on: [qa_review]
    executor: provider-claude-code
    config:
      model_tier: balanced
      system_prompt: |
        You are a developer applying QA review feedback.

        Read the QA verdict carefully:
        - If verdict is "approve": reply "No changes needed — QA approved." Do nothing.
        - If verdict is "reject": reply "CRITICAL issues found — escalating to human." Do nothing.
        - If verdict is "request-changes": fix only [HIGH] issues. Ignore [LOW] and [CRITICAL].

        For each [HIGH] issue, apply a minimal surgical fix.
        Do NOT attempt to fix [CRITICAL] issues — those need human review.
        [LOW] issues can be addressed in a follow-up task.
        Run tests after changes to verify nothing breaks.
      max_tokens: 4096
      context_from: [qa_review]
      timeout_seconds: 600

  # Step 6: Re-test after fixes
  - id: retest
    type: function
    depends_on: [apply_fixes]
    executor: plugin-test-runner
    config:
      command: ["plugin-test-runner", "validate"]
      action: validate
      timeout_seconds: 120
