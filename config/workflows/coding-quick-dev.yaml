name: coding-quick-dev
version: 2
description: "Quick development: spec → implement → test → QA review → fix → re-test"
requires:
  - plugin: provider-claude-code
  - plugin: bmad-method
  - plugin: plugin-test-runner
steps:
  # Step 1: Quick Flow Solo Dev creates lean spec
  - id: quick_spec
    type: agent
    depends_on: []
    executor: bmad-method
    config:
      model_tier: fast
      system_prompt: |
        You are bmad/quick-flow-solo-dev. Create a minimal but complete tech spec:
        - What to build (scope boundary)
        - Key implementation decisions
        - Files to create/modify
        - Test approach (1-2 sentences)
        Keep it lean. No bureaucracy.
      max_tokens: 2048
      timeout_seconds: 180

  # Step 2: Implement
  - id: implement
    type: agent
    depends_on: [quick_spec]
    executor: provider-claude-code
    config:
      model_tier: balanced
      system_prompt: |
        You are a fast-moving developer. Implement cleanly and efficiently per the spec.
        Ship working code with basic test coverage.
      max_tokens: 4096
      context_from: [quick_spec]
      timeout_seconds: 600

  # Step 3: Run tests
  - id: run_tests
    type: function
    depends_on: [implement]
    executor: plugin-test-runner
    config:
      command: ["plugin-test-runner", "validate"]
      action: validate
      timeout_seconds: 120

  # Step 4: QA review
  - id: qa_review
    type: agent
    depends_on: [run_tests]
    executor: bmad-method
    config:
      model_tier: balanced
      system_prompt: |
        You are bmad/qa. Review this implementation for quality issues:
        - Edge cases not covered by tests
        - Error handling gaps
        - Security concerns (injection, path traversal, etc.)
        - Code clarity and maintainability

        End your review with exactly one of these verdict lines:
        verdict: approve
        verdict: request-changes

        If request-changes, list each issue as:
        - [ISSUE] description of what to fix
      max_tokens: 4096
      context_from: [implement]
      timeout_seconds: 300

  # Step 5: Apply QA fixes (uses QA feedback as instructions)
  - id: apply_fixes
    type: agent
    depends_on: [qa_review]
    executor: provider-claude-code
    config:
      model_tier: balanced
      system_prompt: |
        You are a developer applying QA review feedback.
        The QA reviewer has examined the implementation and provided feedback.

        If the review verdict is "approve", reply with: "No changes needed — QA approved."
        If the review verdict is "request-changes", fix every [ISSUE] listed.
        Run the existing tests after making changes to ensure nothing breaks.
        Be surgical — only change what the review asks for.
      max_tokens: 4096
      context_from: [qa_review]
      timeout_seconds: 600

  # Step 6: Re-test after fixes
  - id: retest
    type: function
    depends_on: [apply_fixes]
    executor: plugin-test-runner
    config:
      command: ["plugin-test-runner", "validate"]
      action: validate
      timeout_seconds: 120
