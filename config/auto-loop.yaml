# Auto-Dev Loop Configuration
# Maps task labels to workflow IDs for automatic routing.
plugin: plugin-auto-loop
poll_interval_secs: 30
max_tasks_per_cycle: 5
skip_validation: false
workspace_dir: "/home/jack/Document/pulse-plugins/coding-pack"

rules:
  - label: "story"
    workflow_id: "coding-story-dev"
    priority: 10
  - label: "bug"
    workflow_id: "coding-bug-fix"
    priority: 10
  - label: "refactor"
    workflow_id: "coding-refactor"
    priority: 10
  - label: "quick"
    workflow_id: "coding-quick-dev"
    priority: 20
  - label: "feature"
    workflow_id: "coding-feature-dev"
    priority: 10
  - label: "review"
    workflow_id: "coding-review"
    priority: 15
  - label: "pr-fix"
    workflow_id: "coding-pr-fix"
    priority: 5
  - label: "*"
    workflow_id: "coding-quick-dev"
    priority: 100
